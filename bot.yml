name: bot
on:
  workflow_dispatch:
    inputs:
      task:
        description: fetch atau run
        default: run
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography
      - run: python bot.py ${{ inputs.task }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PAGES_KEY: ${{ secrets.PAGES_KEY }}
