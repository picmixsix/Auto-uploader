name: bot
on:
  workflow_dispatch:
    inputs:
      task:
        description: fetch, run, atau report
        default: run
  schedule:
    - cron: '*/15 * * * *'
    - cron: '0 13 * * *'
concurrency:
  group: bot-${{ github.event.schedule == '0 13 * * *' && 'report' || 'main' }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests cryptography pillow numpy edge-tts
      - run: |
          T="${{ inputs.task }}"
          if [ -z "$T" ]; then
            if [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then T=report; else T=run; fi
          fi
          if [ "$T" = "report" ]; then python report.py; else python bot.py "$T"; fi
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PAGES_KEY: ${{ secrets.PAGES_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
